[package]
name = "wp-station-knowledge-sync"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "~1"
chrono = { version = "0.4", features = ["serde"] }
maxminddb = { version = "0.27.3", features = ["mmap"] }
ipnetwork = "0.21"
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
redis = { version = "1.7.1", features = ["tokio-comp"] }
sha2 = "0.10"
percent-encoding = "2"
sqlx = { version = "0.8.6", default-features = false, features = ["chrono", "mysql", "postgres", "sqlite", "runtime-tokio-rustls"] }
tempfile = "3"
tokio = { version = "1.52", features = ["fs", "io-util", "macros", "rt", "sync", "time"] }
tracing = "0.1"
url = "2"

[dev-dependencies]
sea-orm = { version = "1.1", default-features = false, features = ["sqlx-sqlite", "runtime-tokio-rustls"] }
wp-station-migrations = { path = "../migrations" }
